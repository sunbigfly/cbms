# ==========================================
# Serena 项目配置 - Large Project Template
# ==========================================
# 适用场景: 大型 SaaS 应用 | 复杂业务系统 | 企业级应用（50+ 页面）
# 最后更新: 2025-01-07
# ==========================================

# ===== 项目信息 =====
project_name: "large-project"

# ===== 语言配置 =====
languages:
  - typescript
  - bash

encoding: "utf-8"

# ===== 忽略文件 =====
ignore_all_files_in_gitignore: true

ignored_paths:
  # Node.js 依赖
  - "node_modules/**"
  - ".pnpm-store/**"

  # Next.js 构建输出
  - ".next/**"
  - "out/**"
  - "build/**"
  - "dist/**"

  # TypeScript 编译产物
  - "*.tsbuildinfo"
  - "next-env.d.ts"

  # 锁文件
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"

  # 环境变量
  - ".env"
  - ".env.local"
  - ".env.*.local"
  - ".env.example"

  # 日志
  - "*.log"
  - "logs/**"

  # 测试覆盖率
  - "coverage/**"
  - ".nyc_output/**"

  # Prisma 生成文件
  - "prisma/migrations/**"

  # shadcn/ui 组件（保留，但不索引）
  - "src/components/ui/**"

  # 备份文件
  - "*.backup.*"

  # IDE 配置
  - ".vscode/**"
  - ".idea/**"

# ===== 访问控制 =====
read_only: false

# ===== 工具管理（项目级别）=====
excluded_tools: []
included_optional_tools: []

# ===== 初始提示 =====
initial_prompt: |
  # Large Project Template - 大型项目模板

  ## 🎯 项目定位

  **适用场景**: 大型 SaaS 应用 | 复杂业务系统 | 企业级应用（50+ 页面）

  ## 📦 核心技术栈（15-20 个依赖）

  ```
  框架：      Next.js 15.1.8 (App Router)
  语言：      React 19.2.0
  类型系统：  TypeScript 5.9.2 (strict mode)
  样式：      Tailwind CSS 3.4.0
  UI 组件：   shadcn/ui (基于 Radix UI + Tailwind CSS)
  数据库：    PostgreSQL
  ORM：       Prisma 6.19.0
  认证：      NextAuth 4.24.0 (稳定版，非 v5 beta)
  表单：      React Hook Form 7.54.0 + Zod 3.24.0
  工具库：    clsx 2.1.0, tailwind-merge 2.2.0, bcryptjs 2.4.3
  图标：      lucide-react 0.263.1
  变体系统：  class-variance-authority 0.7.0
  包管理：    npm / pnpm（任意）
  ```

  **选型理由**:
  - **Prisma**: AI 训练数据最丰富的 ORM，错误率 ~5%
  - **NextAuth v4**: 稳定版，AI 错误率 ~5-10%（v5 beta 错误率 ~30-40%）
  - **React Hook Form + Zod**: 行业标准，AI 训练数据极其丰富
  - **shadcn/ui**: 代码在项目中，AI 可完全理解和修改，完全控制
  - **tailwind-merge**: 智能合并 Tailwind 类名，避免冲突
  - **lucide-react**: 现代图标库，shadcn/ui 默认使用
  - **class-variance-authority**: 类型安全的组件变体系统

  ## 🚫 强制禁止（保持简洁和 AI 友好）

  - ❌ Pages Router（必须使用 App Router）
  - ❌ CSS Modules / Styled Components（必须使用 Tailwind）
  - ❌ NextAuth v5 beta（使用稳定的 v4）
  - ❌ tRPC（使用标准 REST API / Route Handlers）
  - ❌ Zustand / Redux（使用 React Context）
  - ❌ Material-UI / Ant Design（使用 shadcn/ui）
  - ❌ 自定义 logger（直接用 console.log）
  - ❌ `any` 类型（除非有 `@ts-expect-error` 说明）

  ## ✅ 核心开发规范

  ### 1. TypeScript 规范
  - ✅ 启用 `strict: true`
  - ✅ 使用 `interface` 定义对象类型（优先于 `type`）
  - ✅ 避免 `any`，使用 `unknown` 或具体类型
  - ✅ 为所有函数参数和返回值添加类型

  ### 2. shadcn/ui 使用规范

  **为什么选择 shadcn/ui？**
  - ✅ **AI 友好**: 组件代码直接复制到项目中，AI 可以完全理解和修改
  - ✅ **完全控制**: 代码在你的项目中，可以自由定制
  - ✅ **类型安全**: 完整的 TypeScript 支持
  - ✅ **无依赖锁定**: 不是 npm 包，而是代码片段
  - ✅ **Tailwind 原生**: 使用 Tailwind CSS，与技术栈完美契合
  - ✅ **可访问性**: 基于 Radix UI，符合 WAI-ARIA 标准

  **基础组件使用**:
  ```tsx
  import { Button } from '@/components/ui/button'

  export function MyComponent() {
    return (
      <div className="space-y-4">
        <Button>Default</Button>
        <Button variant="destructive">Delete</Button>
        <Button variant="outline">Cancel</Button>
        <Button variant="ghost">Ghost</Button>
        <Button size="sm">Small</Button>
        <Button size="lg">Large</Button>
      </div>
    )
  }
  ```

  **表单组件使用**:
  ```tsx
  'use client'

  import { useForm } from 'react-hook-form'
  import { zodResolver } from '@hookform/resolvers/zod'
  import { z } from 'zod'
  import { Button } from '@/components/ui/button'
  import { Input } from '@/components/ui/input'
  import {
    Form,
    FormControl,
    FormDescription,
    FormField,
    FormItem,
    FormLabel,
    FormMessage,
  } from '@/components/ui/form'

  const formSchema = z.object({
    username: z.string().min(2, '用户名至少2个字符'),
    email: z.string().email('邮箱格式不正确'),
  })

  export function ProfileForm() {
    const form = useForm<z.infer<typeof formSchema>>({
      resolver: zodResolver(formSchema),
      defaultValues: {
        username: '',
        email: '',
      },
    })

    function onSubmit(values: z.infer<typeof formSchema>) {
      console.log(values)
    }

    return (
      <Form {...form}>
        <form onSubmit={form.handleSubmit(onSubmit)} className="space-y-8">
          <FormField
            control={form.control}
            name="username"
            render={({ field }) => (
              <FormItem>
                <FormLabel>用户名</FormLabel>
                <FormControl>
                  <Input placeholder="请输入用户名" {...field} />
                </FormControl>
                <FormDescription>这是你的公开显示名称</FormDescription>
                <FormMessage />
              </FormItem>
            )}
          />
          <FormField
            control={form.control}
            name="email"
            render={({ field }) => (
              <FormItem>
                <FormLabel>邮箱</FormLabel>
                <FormControl>
                  <Input type="email" placeholder="请输入邮箱" {...field} />
                </FormControl>
                <FormMessage />
              </FormItem>
            )}
          />
          <Button type="submit">提交</Button>
        </form>
      </Form>
    )
  }
  ```

  ### 3. Prisma 最佳实践

  **Schema 设计规范**:
  - ✅ 使用 `cuid()` 作为 ID（比 UUID 更短）
  - ✅ 使用 camelCase 命名（Prisma 默认）
  - ✅ 添加 `createdAt` 和 `updatedAt` 时间戳
  - ✅ 使用 `@unique` 约束唯一字段

  **使用示例**:
  ```tsx
  // Server Component 中使用
  import { prisma } from '@/lib/prisma'

  async function getUsers() {
    return await prisma.user.findMany()
  }

  // API Route 中使用
  import { prisma } from '@/lib/prisma'
  import { NextResponse } from 'next/server'

  export async function GET() {
    const users = await prisma.user.findMany()
    return NextResponse.json(users)
  }
  ```

  ### 4. NextAuth v4 配置

  **已配置在 `src/lib/auth.ts`**:
  - ✅ Prisma Adapter（数据库集成）
  - ✅ JWT 策略（无状态会话）
  - ✅ Credentials Provider（邮箱密码登录）
  - ✅ 密码加密（bcryptjs）

  **使用示例**:
  ```tsx
  // Server Component 中获取会话
  import { getServerSession } from 'next-auth'
  import { authOptions } from '@/lib/auth'

  export default async function Page() {
    const session = await getServerSession(authOptions)

    if (!session) {
      return <div>Please sign in</div>
    }

    return <div>Welcome {session.user?.name}</div>
  }
  ```

  ### 5. 项目结构（完整分层）

  ```
  large-project/
  ├── src/
  │   ├── app/               # Next.js App Router
  │   │   ├── (auth)/       # 路由组（认证相关页面）
  │   │   ├── api/          # API Routes
  │   │   │   └── auth/
  │   │   │       └── [...nextauth]/
  │   │   │           └── route.ts
  │   │   ├── layout.tsx    # 根布局
  │   │   ├── page.tsx      # 首页
  │   │   └── globals.css   # 全局样式（含 shadcn/ui CSS 变量）
  │   ├── components/        # React 组件
  │   │   ├── ui/           # shadcn/ui 组件（自动生成）
  │   │   └── features/     # 业务组件
  │   └── lib/              # 工具函数
  │       ├── prisma.ts    # Prisma 客户端
  │       ├── auth.ts      # NextAuth 配置
  │       └── utils.ts     # 通用工具（cn 函数）
  ├── prisma/
  │   └── schema.prisma    # 数据库 Schema
  ├── public/              # 静态资源
  ├── components.json      # shadcn/ui 配置
  ├── .env.example         # 环境变量示例
  ├── package.json
  ├── tsconfig.json
  ├── next.config.ts
  ├── tailwind.config.ts
  └── postcss.config.js
  ```

  **shadcn/ui 组件目录说明**:
  - `components/ui/` - shadcn/ui 组件会自动安装到这里
  - 每个组件都是独立的 `.tsx` 文件，可以自由修改
  - 示例: `button.tsx`, `form.tsx`, `dialog.tsx`, `input.tsx` 等

  ## 🎨 设计原则

  ### 1. AI 友好性优先
  - ✅ 选择 AI 训练数据最丰富的技术（如 NextAuth v4 而非 v5 beta）
  - ✅ 使用标准化的 API 模式（REST > tRPC）
  - ✅ 避免频繁变化的 beta 版本

  ### 2. 简洁性优先
  - ✅ 能用标准方案就不用第三方库（React Context > Zustand）
  - ✅ 避免过度抽象（直接用 console.log，不需要自定义 logger）
  - ✅ 最少代码完成功能

  ### 3. 稳定性优先
  - ✅ 使用稳定版本，避免 beta/canary
  - ✅ 选择成熟的技术栈
  - ✅ 等待 AI 训练数据充足后再采用新特性

  ### 4. 分层灵活
  - ✅ 完整的组件分层（ui/ + features/）
  - ✅ 路由组织（路由组）
  - ✅ 可扩展的架构

  ## 📋 代码检查清单

  每次提交前必须确认：
  - [ ] 所有 TypeScript 类型正确（无 `any`）
  - [ ] 样式使用 Tailwind CSS utility classes
  - [ ] 条件类名使用 `cn()` 函数处理
  - [ ] UI 组件优先使用 shadcn/ui
  - [ ] 数据库操作使用 Prisma
  - [ ] 认证使用 NextAuth v4
  - [ ] 表单使用 React Hook Form + Zod
  - [ ] 图片使用 `next/image` 组件
  - [ ] Server/Client Components 使用正确
  - [ ] `npm run build` 通过
  - [ ] `npm run lint` 无错误

